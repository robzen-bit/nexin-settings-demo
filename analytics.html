<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tour Analytics — Gallery Permissions Prototype</title>
  <script src="analytics-config.js"></script>
  <style>
    :root {
      --brand: #C75B39; --brand-cream: #FFF1E6;
      --text-1: #1B1C1F; --text-2: #6B6E76; --text-3: #9DA0A8;
      --bg: #F7F5F2; --card-border: #E7E4DE; --green: #3E7C4F; --danger: #C0392B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-1); padding: 32px 24px 80px; }
    .wrap { max-width: 1080px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--brand); margin-bottom: 4px; }
    .sub { font-size: 13px; color: var(--text-2); margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
    .card h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); margin-bottom: 14px; }
    .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filters label { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .filters input[type="date"] { font-size: 13px; padding: 6px 8px; border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-1); background: #fff; }
    .filters button, .refresh { font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--card-border); background: #fff; color: var(--text-1); cursor: pointer; }
    .filters button.active { border-color: var(--brand); background: var(--brand-cream); color: var(--brand); }
    .refresh { border-color: var(--brand); color: var(--brand); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .tile { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 16px; }
    .tile .n { font-size: 24px; font-weight: 800; }
    .tile .l { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-2); margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--card-border); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--card-border); }
    tr.tour-row { cursor: pointer; }
    tr.tour-row:hover { background: var(--brand-cream); }
    tr.tour-row.selected { background: var(--brand-cream); }
    .rate-good { color: var(--green); font-weight: 700; }
    .rate-bad { color: var(--danger); font-weight: 700; }
    .muted { color: var(--text-3); }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 6px; overflow-x: auto; }
    .bar-col { display: flex; flex-direction: column-reverse; justify-content: flex-start; width: 22px; min-width: 14px; flex: 1 0 auto; max-width: 34px; }
    .bar-seg { width: 100%; }
    .bar-lbl { font-size: 9px; color: var(--text-3); text-align: center; margin-top: 4px; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--text-2); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
    .funnel-step { width: 64px; color: var(--text-2); font-weight: 600; flex-shrink: 0; }
    .funnel-track { flex: 1; background: var(--bg); border-radius: 6px; height: 22px; position: relative; }
    .funnel-fill { height: 100%; border-radius: 6px; background: var(--brand); opacity: 0.85; }
    .funnel-n { width: 130px; flex-shrink: 0; color: var(--text-1); }
    .funnel-t { width: 74px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
    /* Info icon + hover tooltip describing what the user does/learns on each step */
    .funnel-info { position: relative; flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%;
      border: 1.5px solid var(--text-3); color: var(--text-3); font-size: 10px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; cursor: help; font-style: italic;
      font-family: Georgia, serif; }
    .funnel-info:hover { border-color: var(--brand); color: var(--brand); }
    .funnel-info .tip { display: none; position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
      width: 330px; background: var(--text-1); color: #fff; font-size: 12px; font-weight: 400; font-style: normal;
      font-family: inherit; line-height: 1.5; padding: 9px 12px; border-radius: 8px; text-align: left;
      z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,0.22); pointer-events: none; }
    .funnel-info:hover .tip { display: block; }
    /* Last rows flip the tooltip above so it can't run off the bottom of the card */
    .funnel-info.tip-up .tip { top: auto; bottom: 22px; left: 0; transform: none; }
    .funnel-t { width: 78px; flex-shrink: 0; text-align: right; font-size: 12px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 2px solid var(--card-border); }
    .tabs button { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; padding: 10px 18px; border: none; background: none; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
    .notice { padding: 40px 20px; text-align: center; color: var(--text-2); font-size: 14px; line-height: 1.6; }
    .notice code { background: #fff; border: 1px solid var(--card-border); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tour Analytics</h1>
    <div class="sub">Gallery Permissions prototype — anonymous tour usage. All times local. <span id="loaded-note" class="muted"></span></div>

    <div id="app"></div>
  </div>

  <script>
    const CFG = window.TOUR_ANALYTICS_CONFIG || { url: '', anonKey: '' };
    // steps = the tour's displayed step count, so the funnel can show the steps
    // nobody reached, not just the ones with data.
    const TOURS = [
      { id: 'overview',         label: 'General Overview',                  steps: 6 },
      { id: 'default-audience', label: 'Using the Default Audience',        steps: 7 },
      { id: 'audiences',        label: 'Using Audiences',                   steps: 10 },
      { id: 'saved-audiences',  label: 'Saved Custom Audiences',            steps: 15 },
      { id: 'contacts',         label: 'Adding Contacts to Audiences',      steps: 5 },
      { id: 'presets',          label: 'Saving and Using Presets',          steps: 5 },
      { id: 'registration',     label: 'Using Audiences with Registration', steps: 5 },
    ];
    // What each displayed step teaches or asks the user to do — shown as a hover tooltip in
    // the step funnel. Keys are the DISPLAYED step numbers (what step_reached reports), which
    // is why tours with retired/silent phases skip around in the source but are contiguous here.
    const STEP_INFO = {
      'overview': {
        1: 'Learn: Gallery Access — how the gallery can be accessed (Public, Password Protected, Invite Only, Offline), plus registration and search visibility.',
        2: 'Learn: Gallery Permissions — where permissions like downloads, screenshot protection, face finder and watermarks are turned on and off.',
        3: 'Learn: the Add Audience button — an audience is a permission set you can add contacts to.',
        4: 'Learn: the Default audience — the baseline settings everyone gets unless they belong to another audience.',
        5: 'Learn: permissions by audience — permissions can be toggled and customized per audience.',
        6: 'Learn: full gallery permissions — these apply to the whole gallery and everyone in it, not per audience.',
      },
      'default-audience': {
        1: 'Do: turn on the Screenshot Protection toggle under the Default audience.',
        2: 'Learn: some permissions have advanced settings. Do: click the chevron to expand Screenshot Protection’s settings.',
        3: 'Learn: the advanced settings panel. Do: click the chevron again to collapse it.',
        4: 'Do: turn on the Face Finder toggle for the Default audience (simple on/off permission).',
        5: 'Do: click Default in the audience header to open the add-contact window.',
        6: 'Do: enter an email and click Add as Default to add a contact to the Default audience.',
        7: 'Recap: the Default audience is the baseline permissions for visitors and Default contacts.',
      },
      'audiences': {
        1: 'Do: click the Add Audience button.',
        2: 'Do: select both the Guest and Client audiences, then click Add Audiences.',
        3: 'Learn: the matrix shows a column per audience; each permission can be controlled per audience. Free exploration allowed.',
        4: 'Do: click the Photo Downloads row to expand its per-audience settings.',
        5: 'Learn: grayed-out settings mean the permission is off. Do: toggle Photo Downloads on for Guest.',
        6: 'Do: change Guest’s Download Type Allowed to Specific Amount Download.',
        7: 'Do: set the number of images to 5, check Medium and uncheck Original under Gallery Allowed Resolutions.',
        8: 'Do: click the Photo Downloads row header to collapse it.',
        9: 'Learn: Favorites lets visitors bookmark photos. Do: turn it on for every audience.',
        10: 'Learn: sidebar indicators — fully lit means a permission is on for all audiences, partially lit means only some.',
      },
      'saved-audiences': {
        1: 'Do: click the Add Audience button. (A genre was picked just before this to tailor name suggestions.)',
        2: 'Do: click Create Your Own to start a custom audience.',
        3: 'Do: name the most-privileged group (suggested name offered) and click Next.',
        4: 'Learn: adding a contact is optional. Do: click Create Audience.',
        5: 'Free-play: customize the first custom audience’s permissions, then click Continue Tour.',
        6: 'Do: click Add Audience again to create a second, less-privileged custom audience.',
        7: 'Do: click Create Your Own.',
        8: 'Do: name the less-privileged group (suggested name offered) and click Next.',
        9: 'Do: click Create Audience.',
        10: 'Free-play: customize the second audience with fewer permissions, then click Continue Tour.',
        11: 'Do: open the three-dot menu on the first custom audience’s header.',
        12: 'Learn: the menu can rename, duplicate, remove or save an audience. Do: click Save for Later Use.',
        13: 'Do: click Add Audience to see where Saved Custom Audiences live.',
        14: 'Learn: the Saved Custom Audiences section — reuse saved audiences on any gallery; deleting from the list doesn’t remove them from galleries.',
        15: 'Recap: created two custom audiences, customized both, and saved one for reuse.',
      },
      'contacts': {
        1: 'Do: click Parents in the audience header — the quickest way to add a contact to an audience.',
        2: 'Do: enter an email and click Add as Parents (email is the only required field).',
        3: 'Do: click Contacts in the sidebar to see everyone on the gallery.',
        4: 'Learn: first two audiences get their own button, the rest live under More Audiences. Do: add a contact to any audience.',
        5: 'Learn: Add from Contacts pulls from the existing contact list; Import CSV brings in a spreadsheet (with an optional Audience column).',
      },
      'presets': {
        1: 'Do: click Setting Presets in the sidebar.',
        2: 'Do: click Apply a New Preset, choose a preset, and click Apply.',
        3: 'Learn: the confirmation summarizes which audiences get added, updated or removed. Do: click Confirm.',
        4: 'Learn: the preset replaced the gallery’s audiences and permissions; contacts from removed audiences moved to Default.',
        5: 'Learn: Save New Preset is where the current gallery setup would be saved as a reusable preset (not hooked up in the prototype).',
      },
      'registration': {
        1: 'Do: click Collect Email to turn on the simplest registration.',
        2: 'Learn: the Registrant Audience dropdown decides which audience registrants join — and the permissions they get.',
        3: 'Do: click Custom Form to turn on a richer registration form.',
        4: 'Do: click Edit Form to open the custom form editor.',
        5: 'Learn: Registrant Audience Assignment in the form editor works the same way — form completions land in the chosen audience.',
      },
    };
    const COLORS = ['#C75B39', '#3E7C4F', '#4A6FA5', '#B08C2E', '#7B5EA7', '#3B8E8C', '#A5556F'];
    const tourLabel = (id) => (TOURS.find(t => t.id === id) || { label: id || 'unknown' }).label;
    const tourColor = (id) => COLORS[Math.max(0, TOURS.findIndex(t => t.id === id)) % COLORS.length];

    const app = document.getElementById('app');
    const fmtDur = (s) => {
      if (s == null || isNaN(s)) return '—';
      const m = Math.floor(s / 60), sec = Math.round(s % 60);
      return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
    };
    const fmtPct = (x) => (x == null || isNaN(x)) ? '—' : `${Math.round(x * 100)}%`;
    const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const dstr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    let state = { from: null, to: null, events: [], feedback: [], feedbackError: null, selectedTour: null, preset: 30, tab: 'analytics' };

    if (!CFG.url || !CFG.anonKey) {
      app.innerHTML = `<div class="card notice">Analytics isn't configured yet.<br/>
        Fill in the Supabase project URL and anon key in <code>analytics-config.js</code>
        (after running <code>analytics-setup.sql</code> in the Supabase SQL editor), then reload this page.</div>`;
    } else {
      boot();
    }

    function boot() {
      const today = new Date();
      const from = new Date(today); from.setDate(from.getDate() - 29);
      state.from = dstr(from); state.to = dstr(today);
      render(true);
      load();
    }

    async function fetchEvents(fromIso, toIso) {
      const all = [];
      const page = 1000;
      let cols = 'created_at,event,session_id,tour_id,step,duration_s,label';
      const filters = `&created_at=gte.${encodeURIComponent(fromIso)}&created_at=lt.${encodeURIComponent(toIso)}&order=created_at.asc`;
      // New-style publishable keys (sb_publishable_...) go in apikey only; legacy anon keys
      // are JWTs (eyJ...) and also go in the Authorization header.
      const authHeaders = { apikey: CFG.anonKey };
      if (CFG.anonKey.startsWith('eyJ')) authHeaders.Authorization = `Bearer ${CFG.anonKey}`;
      for (let offset = 0; offset < 200000; offset += page) {
        const res = await fetch(`${CFG.url}/rest/v1/tour_events?select=${cols}${filters}`, {
          headers: { ...authHeaders, 'Range-Unit': 'items', Range: `${offset}-${offset + page - 1}` },
        });
        // Tables created before the label migration reject the label column with a 400 —
        // retry once without it so the dashboard still works pre-migration.
        if (res.status === 400 && offset === 0 && cols.includes(',label')) {
          cols = cols.replace(',label', '');
          offset -= page;
          continue;
        }
        if (!res.ok && res.status !== 206) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        all.push(...rows);
        if (rows.length < page) break;
      }
      return all;
    }

    async function fetchFeedback(fromIso, toIso) {
      const authHeaders = { apikey: CFG.anonKey };
      if (CFG.anonKey.startsWith('eyJ')) authHeaders.Authorization = `Bearer ${CFG.anonKey}`;
      const cols = 'created_at,session_id,meets_requirements,ease_of_use,comments,source';
      const res = await fetch(`${CFG.url}/rest/v1/tour_feedback?select=${cols}&created_at=gte.${encodeURIComponent(fromIso)}&created_at=lt.${encodeURIComponent(toIso)}&order=created_at.desc&limit=1000`, {
        headers: authHeaders,
      });
      if (!res.ok && res.status !== 206) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function load() {
      const note = document.getElementById('loaded-note');
      note.textContent = 'Loading…';
      try {
        const fromIso = new Date(`${state.from}T00:00:00`).toISOString();
        const toEx = new Date(`${state.to}T00:00:00`); toEx.setDate(toEx.getDate() + 1);
        // Feedback loads separately and its failure (e.g. tour_feedback table not yet
        // created) must not take down the events dashboard.
        const [events, feedback] = await Promise.all([
          fetchEvents(fromIso, toEx.toISOString()),
          fetchFeedback(fromIso, toEx.toISOString()).then(
            rows => ({ rows, error: null }),
            e => ({ rows: [], error: e.message })
          ),
        ]);
        state.events = events;
        state.feedback = feedback.rows;
        state.feedbackError = feedback.error;
        note.textContent = `${state.events.length.toLocaleString()} events · ${state.feedback.length.toLocaleString()} feedback response${state.feedback.length === 1 ? '' : 's'} loaded · ${new Date().toLocaleTimeString()}`;
        render(false);
      } catch (e) {
        note.innerHTML = `<span class="err">Couldn't load events (${esc(e.message)}). Check the config values and the Supabase policies.</span>`;
      }
    }

    // ---- Aggregation ----
    function aggregate(events) {
      const perTour = new Map();
      const forTour = (id) => {
        if (!perTour.has(id)) perTour.set(id, { started: new Set(), completed: new Set(), durations: [], steps: new Map(), cancelSteps: [], stepDurations: new Map(), _pendingStep: new Map() });
        return perTour.get(id);
      };
      // Time-on-step: events arrive in chronological order, so each session's dwell time on a
      // step is the gap between that step_reached and the session's next event for the same
      // tour (next step, completion, or cancel). Gaps over 30 min are treated as the visitor
      // having walked away and are excluded from averages.
      const MAX_STEP_S = 1800;
      const closeStep = (rec, sessionId, endMs) => {
        const p = rec._pendingStep.get(sessionId);
        if (!p) return;
        rec._pendingStep.delete(sessionId);
        const dur = (endMs - p.t) / 1000;
        if (dur >= 0 && dur <= MAX_STEP_S) {
          if (!rec.stepDurations.has(p.step)) rec.stepDurations.set(p.step, []);
          rec.stepDurations.get(p.step).push(dur);
        }
      };
      const byDay = new Map();
      // Unique-label rollups (deduped by session, grouped case-insensitively)
      const genres = new Map();
      const names = new Map();
      for (const ev of events) {
        const t = ev.tour_id || 'unknown';
        const rec = forTour(t);
        if (ev.event === 'tour_started') rec.started.add(ev.session_id);
        else if (ev.event === 'tour_completed') {
          rec.completed.add(ev.session_id);
          closeStep(rec, ev.session_id, Date.parse(ev.created_at));
          if (ev.duration_s != null) rec.durations.push(ev.duration_s);
          const day = dstr(new Date(ev.created_at));
          if (!byDay.has(day)) byDay.set(day, new Map());
          const dm = byDay.get(day);
          dm.set(t, (dm.get(t) || 0) + 1);
        } else if (ev.event === 'step_reached' && ev.step != null) {
          if (!rec.steps.has(ev.session_id)) rec.steps.set(ev.session_id, new Set());
          rec.steps.get(ev.session_id).add(ev.step);
          const now = Date.parse(ev.created_at);
          closeStep(rec, ev.session_id, now);
          rec._pendingStep.set(ev.session_id, { step: ev.step, t: now });
        } else if (ev.event === 'tour_cancelled' && ev.step != null) {
          closeStep(rec, ev.session_id, Date.parse(ev.created_at));
          rec.cancelSteps.push(ev.step);
        } else if (ev.event === 'genre_selected' && ev.label) {
          const key = String(ev.label).trim().toLowerCase();
          if (key) {
            if (!genres.has(key)) genres.set(key, { display: key.charAt(0).toUpperCase() + key.slice(1), sessions: new Set() });
            genres.get(key).sessions.add(ev.session_id);
          }
        } else if (ev.event === 'audience_named' && ev.label) {
          const key = String(ev.label).trim().toLowerCase();
          if (key) {
            if (!names.has(key)) names.set(key, { display: String(ev.label).trim(), sessions: new Set() });
            names.get(key).sessions.add(ev.session_id);
          }
        }
      }
      return { perTour, byDay, genres, names };
    }
    const median = (a) => {
      if (!a.length) return null;
      const s = [...a].sort((x, y) => x - y);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    };
    const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

    // ---- Rendering ----
    function render(initialOnly) {
      const { perTour, byDay, genres, names } = aggregate(state.events);
      const tourIds = TOURS.map(t => t.id).filter(id => perTour.has(id))
        .concat([...perTour.keys()].filter(id => !TOURS.some(t => t.id === id)));

      let totStartSessions = new Set(), totCompletions = 0, totAttempts = 0, totCompleted = 0;
      let best = null, worst = null;
      for (const id of tourIds) {
        const r = perTour.get(id);
        r.started.forEach(s => totStartSessions.add(s));
        totCompletions += r.completed.size;
        totAttempts += r.started.size;
        totCompleted += r.completed.size;
        const rate = r.started.size ? r.completed.size / r.started.size : null;
        if (rate != null && r.started.size >= 3) {
          if (!best || rate > best.rate) best = { id, rate };
          if (!worst || rate < worst.rate) worst = { id, rate };
        }
      }
      const overallRate = totAttempts ? totCompleted / totAttempts : null;

      const presets = [7, 30, 90, 0];
      const presetLbl = { 7: '7 days', 30: '30 days', 90: '90 days', 0: 'All time' };

      const analyticsTab = `
        <div class="tiles" style="margin-bottom:18px">
          <div class="tile"><div class="n">${totStartSessions.size.toLocaleString()}</div><div class="l">Unique visitors starting a tour</div></div>
          <div class="tile"><div class="n">${totCompletions.toLocaleString()}</div><div class="l">Tour completions</div></div>
          <div class="tile"><div class="n">${fmtPct(overallRate)}</div><div class="l">Overall completion rate</div></div>
          <div class="tile"><div class="n" style="font-size:15px;padding-top:6px">${best ? esc(tourLabel(best.id)) + ' (' + fmtPct(best.rate) + ')' : '—'}</div><div class="l">Best completion rate</div></div>
          <div class="tile"><div class="n" style="font-size:15px;padding-top:6px">${worst ? esc(tourLabel(worst.id)) + ' (' + fmtPct(worst.rate) + ')' : '—'}</div><div class="l">Most dropped</div></div>
        </div>

        <div class="card">
          <h2>Completions by date</h2>
          ${renderDailyChart(byDay)}
        </div>

        <div class="card">
          <h2>Per-tour performance <span class="muted" style="text-transform:none;font-weight:500">— click a row for its step funnel</span></h2>
          <table>
            <thead><tr><th>Tour</th><th>Started</th><th>Completed</th><th>Completion rate</th><th>Drop rate</th><th>Avg time</th><th>Median time</th></tr></thead>
            <tbody>
              ${tourIds.length ? tourIds.map(id => {
                const r = perTour.get(id);
                const rate = r.started.size ? r.completed.size / r.started.size : null;
                return `<tr class="tour-row ${state.selectedTour === id ? 'selected' : ''}" data-tour="${esc(id)}">
                  <td><span class="sw" style="background:${tourColor(id)};margin-right:7px"></span>${esc(tourLabel(id))}</td>
                  <td>${r.started.size}</td>
                  <td>${r.completed.size}</td>
                  <td class="${rate != null && rate >= 0.5 ? 'rate-good' : rate != null ? 'rate-bad' : ''}">${fmtPct(rate)}</td>
                  <td>${rate != null ? fmtPct(1 - rate) : '—'}</td>
                  <td>${fmtDur(avg(r.durations))}</td>
                  <td>${fmtDur(median(r.durations))}</td>
                </tr>`;
              }).join('') : `<tr><td colspan="7" class="muted">No events in this date range yet.</td></tr>`}
            </tbody>
          </table>
        </div>

        <div class="card">
          <h2>Step funnel ${state.selectedTour ? '— ' + esc(tourLabel(state.selectedTour)) : ''}${state.selectedTour ? ' <span class="muted" style="text-transform:none;font-weight:500">— hover the ⓘ on a step to see what it covers</span>' : ''}</h2>
          ${state.selectedTour ? renderFunnel(perTour.get(state.selectedTour), state.selectedTour) : '<div class="muted" style="font-size:13px">Click a tour row above to see how far people get, step by step.</div>'}
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px">
          <div class="card" style="margin-bottom:0">
            <h2>Genres picked <span class="muted" style="text-transform:none;font-weight:500">— Saved Custom Audiences tour</span></h2>
            ${renderLabelTable(genres, 'Genre')}
          </div>
          <div class="card" style="margin-bottom:0">
            <h2>Custom audience names <span class="muted" style="text-transform:none;font-weight:500">— unique, per person</span></h2>
            ${renderLabelTable(names, 'Name')}
          </div>
        </div>
      `;

      const feedbackTab = `
        <div class="card">
          <h2>Feedback survey</h2>
          ${renderFeedback()}
        </div>
      `;

      app.innerHTML = `
        <div class="tabs">
          <button data-tab="analytics" class="${state.tab === 'analytics' ? 'active' : ''}">ANALYTICS</button>
          <button data-tab="feedback" class="${state.tab === 'feedback' ? 'active' : ''}">FEEDBACK</button>
        </div>

        <div class="card">
          <div class="filters">
            <label>From <input type="date" id="f-from" value="${state.from}"></label>
            <label>To <input type="date" id="f-to" value="${state.to}"></label>
            ${presets.map(p => `<button data-preset="${p}" class="${state.preset === p ? 'active' : ''}">${presetLbl[p]}</button>`).join('')}
            <button class="refresh" id="f-refresh">Refresh</button>
          </div>
        </div>

        ${state.tab === 'feedback' ? feedbackTab : analyticsTab}
      `;

      app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
        state.tab = b.dataset.tab;
        render(false);
      });
      document.getElementById('f-refresh').onclick = () => { readDates(); state.preset = null; load(); };
      document.getElementById('f-from').onchange = readDates;
      document.getElementById('f-to').onchange = readDates;
      app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
        const p = parseInt(b.dataset.preset, 10);
        state.preset = p;
        const today = new Date();
        const from = new Date(today);
        if (p === 0) from.setFullYear(2024, 0, 1); else from.setDate(from.getDate() - (p - 1));
        state.from = dstr(from); state.to = dstr(today);
        load();
      });
      app.querySelectorAll('.tour-row').forEach(tr => tr.onclick = () => {
        state.selectedTour = state.selectedTour === tr.dataset.tour ? null : tr.dataset.tour;
        render(false);
      });
      function readDates() {
        state.from = document.getElementById('f-from').value || state.from;
        state.to = document.getElementById('f-to').value || state.to;
      }
    }

    function renderDailyChart(byDay) {
      const days = [];
      const start = new Date(`${state.from}T00:00:00`), end = new Date(`${state.to}T00:00:00`);
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(dstr(d));
      if (days.length > 120) return '<div class="muted" style="font-size:13px">Range too wide for the daily chart — narrow it to 120 days or fewer.</div>';
      let max = 1;
      for (const day of days) {
        const dm = byDay.get(day);
        if (dm) max = Math.max(max, [...dm.values()].reduce((a, b) => a + b, 0));
      }
      const usedTours = new Set();
      const cols = days.map(day => {
        const dm = byDay.get(day) || new Map();
        const total = [...dm.values()].reduce((a, b) => a + b, 0);
        const segs = [...dm.entries()].map(([t, n]) => {
          usedTours.add(t);
          return `<div class="bar-seg" style="height:${(n / max) * 120}px;background:${tourColor(t)}" title="${esc(tourLabel(t))}: ${n}"></div>`;
        }).join('');
        const lbl = day.slice(5).replace('-', '/');
        return `<div style="display:flex;flex-direction:column;align-items:center" title="${day}: ${total} completion${total === 1 ? '' : 's'}">
          <div class="bar-col">${segs}</div><div class="bar-lbl">${days.length <= 40 ? lbl : ''}</div></div>`;
      }).join('');
      const legend = [...usedTours].map(t => `<span><span class="sw" style="background:${tourColor(t)}"></span>${esc(tourLabel(t))}</span>`).join('');
      return `<div class="bars">${cols}</div><div class="legend">${legend}</div>`;
    }

    function renderLabelTable(map, colName) {
      if (!map || map.size === 0) return '<div class="muted" style="font-size:13px">No data yet in this date range.</div>';
      const rows = [...map.values()].sort((a, b) => b.sessions.size - a.sessions.size);
      const MAX = 50;
      const shown = rows.slice(0, MAX);
      const more = rows.length - shown.length;
      return `<table>
        <thead><tr><th>${esc(colName)}</th><th style="text-align:right">Used by</th></tr></thead>
        <tbody>${shown.map(r => `<tr><td>${esc(r.display)}</td><td style="text-align:right">${r.sessions.size} ${r.sessions.size === 1 ? 'person' : 'people'}</td></tr>`).join('')}</tbody>
      </table>${more > 0 ? `<div class="muted" style="font-size:12px;margin-top:8px">+ ${more} more not shown</div>` : ''}`;
    }

    function renderFeedback() {
      if (state.feedbackError) {
        return `<div class="muted" style="font-size:13px">Couldn't load feedback (${esc(state.feedbackError)}). If the <code>tour_feedback</code> table doesn't exist yet, run the feedback section of <code>analytics-setup.sql</code> in the Supabase SQL editor.</div>`;
      }
      const rows = state.feedback;
      if (!rows.length) return '<div class="muted" style="font-size:13px">No feedback yet in this date range.</div>';
      const meetsAvg = avg(rows.map(r => r.meets_requirements));
      const easeAvg = avg(rows.map(r => r.ease_of_use));
      const fmtScore = (x) => x == null ? '—' : `${(Math.round(x * 10) / 10).toFixed(1)} / 5`;
      const srcLabel = (s) => s === 'topbar' ? 'Top bar link' : s ? tourLabel(s) : '—';
      const scoreCls = (n) => n >= 4 ? 'rate-good' : n <= 2 ? 'rate-bad' : '';
      return `
        <div class="tiles" style="margin-bottom:16px">
          <div class="tile"><div class="n">${rows.length.toLocaleString()}</div><div class="l">Responses</div></div>
          <div class="tile"><div class="n">${fmtScore(meetsAvg)}</div><div class="l">Avg — meets requirements</div></div>
          <div class="tile"><div class="n">${fmtScore(easeAvg)}</div><div class="l">Avg — ease of use</div></div>
        </div>
        <table>
          <thead><tr><th>When</th><th>Meets req.</th><th>Ease of use</th><th>Comments</th><th>From</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td style="white-space:nowrap">${esc(new Date(r.created_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</td>
              <td class="${scoreCls(r.meets_requirements)}">${r.meets_requirements}</td>
              <td class="${scoreCls(r.ease_of_use)}">${r.ease_of_use}</td>
              <td style="max-width:420px">${r.comments ? esc(r.comments) : '<span class="muted">—</span>'}</td>
              <td class="muted" style="white-space:nowrap">${esc(srcLabel(r.source))}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function renderFunnel(rec, tourId) {
      if (!rec || rec.steps.size === 0) return '<div class="muted" style="font-size:13px">No step data for this tour in range.</div>';
      // Show the tour's FULL step ladder — unreached steps render as zero-session rows, so the
      // drop-off is visible against the whole tour, not just the steps that have data.
      let maxStep = (TOURS.find(t => t.id === tourId) || {}).steps || 0;
      rec.steps.forEach(set => set.forEach(s => { if (s > maxStep) maxStep = s; }));
      const rows = [];
      let base = null;
      for (let s = 1; s <= maxStep; s++) {
        let n = 0;
        rec.steps.forEach(set => { let reached = false; set.forEach(x => { if (x >= s) reached = true; }); if (reached) n++; });
        if (base == null) base = n || 1;
        rows.push({ s, n });
      }
      const cancelNote = rec.cancelSteps.length
        ? `<div class="muted" style="font-size:12px;margin-top:10px">${rec.cancelSteps.length} explicit cancel${rec.cancelSteps.length === 1 ? '' : 's'} recorded (most common at step ${median(rec.cancelSteps) != null ? Math.round(median(rec.cancelSteps)) : '—'}).</div>`
        : '';
      const info = STEP_INFO[tourId] || {};
      return rows.map(({ s, n }, i) => {
        const stepAvg = avg(rec.stepDurations.get(s) || []);
        // Tooltips on the last two rows open upward so they can't spill past the card.
        const flip = rows.length > 3 && i >= rows.length - 2 ? ' tip-up' : '';
        const desc = info[s];
        const icon = desc
          ? `<span class="funnel-info${flip}">i<span class="tip">${esc(desc)}</span></span>`
          : `<span class="funnel-info" style="visibility:hidden">i</span>`;
        return `
        <div class="funnel-row">
          <div class="funnel-step">Step ${s}</div>
          ${icon}
          <div class="funnel-track"><div class="funnel-fill" style="width:${n === 0 ? 0 : Math.max(2, (n / base) * 100)}%"></div></div>
          <div class="funnel-n ${n === 0 ? 'muted' : ''}">${n} session${n === 1 ? '' : 's'} · ${fmtPct(n / base)}</div>
          <div class="funnel-t muted" title="Average time spent on this step">${stepAvg != null ? 'avg ' + fmtDur(stepAvg) : ''}</div>
        </div>`;
      }).join('') + cancelNote;
    }
  </script>
</body>
</html>
